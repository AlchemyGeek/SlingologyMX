<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">

.bx{fill:none;stroke:hsl(var(--muted-foreground));stroke-width:1}

<text class="mono" x="150" y="34" text-anchor="middle" style="fill:hsl(var(--foreground))">TODAY</text>
<circle cx="50" cy="80" r="6" fill="hsl(var(--muted-foreground))"/>

<text x="303" y="94" text-anchor="middle">zoom in</text>

<rect class="bx" x="344" y="28" width="288" height="92" rx="8"/>
<rect x="345" y="29" width="286" height="22" fill="hsl(var(--muted))"/>

<text x="38" y="262">Lanes appear gradually between 300 and 130 days of visible span — no snapping.</text>
<circle cx="20" cy="284" r="9" fill="hsl(var(--accent))"/>
<text x="18" y="288" style="fill:hsl(var(--accent-foreground));font-size:11px" text-anchor="middle">3</text>
<text x="38" y="288">Clicking any dot opens a read-only card with a link to the full record.</text>
</svg>
